name: ci

on:
  push:
    branches: [ main, dev ]
  pull_request:

jobs:
  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: pwsh ./rules/Check-SourceFileSize.ps1
      - run: dotnet restore
      # 原生模块由 SysSuite.Interop.csproj 的 BuildNativeModule 目标在 build 阶段自动构建
      # （rules/Build-Native.ps1，刻意不用 cmake —— 后者依赖生成器探测，部分 VS 安装会
      # 以 "No CMAKE_CXX_COMPILER could be found" 失败），产物再由 SysSuite.Tests.csproj
      # 的 CopyNativeModuleForFfiTests 目标投放到测试输出目录，FFI 冒烟因此真实执行。
      # 不要在 build 后再单独跑一次 Build-Native.ps1 -Deploy：那会把 Release 的 DLL
      # 覆盖到 Debug 输出上，且属重复构建。
      - run: dotnet build --no-restore -c Debug /warnaserror
      - run: dotnet test --no-build -c Debug --logger trx
      # FFI 冒烟在缺 DLL 时是静默 Skip（零覆盖且不报错），故显式把跳过数印到日志，
      # 并在异常时发 annotation 让问题可见。不 fail：原生构建在 CI 上偶发失败不应
      # 掩盖托管层的真实测试结果。
      - name: 检查 FFI 冒烟是否静默跳过
        shell: pwsh
        continue-on-error: true
        run: |
          $trx = Get-ChildItem -Recurse -Filter *.trx | Select-Object -First 1
          if (-not $trx) { Write-Host '未找到 trx 结果文件'; exit 0 }
          [xml]$doc = Get-Content $trx.FullName
          $c = $doc.TestRun.ResultSummary.Counters
          Write-Host "passed=$($c.passed) skipped=$($c.skipped) failed=$($c.failed)"
          if ([int]$c.skipped -ne 0) {
            Write-Host "::warning::有 $($c.skipped) 个测试被跳过 —— FFI 冒烟极可能因缺 SysSuite.Native.dll 静默 Skip"
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-test-results
          path: '**/*.trx'

  # 原生模块直接构建并部署到测试输出目录，跑 C# 侧 FFI 冒烟与提权探针。
  # 不走 cmake —— 本机实测其生成器探测会失败（偏差 D10），CI 上没必要再引入
  # 一个已知不可靠的环节。Catch2 ABI 契约测试等 T0.x 补齐 BuildTests 开关后再并入。
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: 构建原生模块并部署
        run: pwsh ./rules/Build-Native.ps1 -Configuration Release -Deploy
      - name: 运行测试以验证 FFI 契约未被破坏
        run: dotnet test tests/SysSuite.Tests -c Release --logger "console;verbosity=normal"
